name: maghz
description: Maghz - Flutter port (stage 1)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_svg: ^2.0.10+1
  record: ^5.1.2
  http: ^1.2.0
  idb_shim: ^2.6.4
  web: ^1.1.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
  assets:
    - assets/body.svg
