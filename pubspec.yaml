name: maghz
description: Maghz - Flutter port (stage 1)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_svg: ^2.0.10+1
  record: ^5.1.2
  audioplayers: ^6.1.0
  http: ^1.2.0
  idb_shim: ^2.6.4
  web: ^1.1.0
  image: ^4.2.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
  assets:
    - assets/body.svg
    - assets/icon-192.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/google_fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: NotoEmoji
      fonts:
        - asset: assets/google_fonts/NotoEmojiSubset.ttf
    # گلیفِ ✓ (U+2713) که تقویم شکرگذاری وب با متنِ «✓» می‌کشه — فقط همین یک نویسه (زیرمجموعه‌ی DejaVu Sans)
    - family: GratCheck
      fonts:
        - asset: assets/google_fonts/GratCheck.ttf
