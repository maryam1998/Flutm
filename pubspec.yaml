name: maghz
description: Maghz - Flutter port (stage 1)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

# پلاگین lifecycle جدید به compileSdk 36 نیاز داره ولی file_picker با 34 کامپایل میشه؛ نسخه‌ی قدیمی‌تر رو ثابت می‌کنیم
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
  # فونت وزیرمتن: فایل‌های ttf را در assets/fonts بگذار و این بخش را از کامنت دربیار
  # fonts:
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
