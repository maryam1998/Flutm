name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web folder if missing
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name maghz /tmp/scaffold
            cp -r /tmp/scaffold/web .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (optional)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test (if test/ exists)
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test/ directory, skipping."
          fi

      - name: Build web
        run: flutter build web --release --base-href "/Flutm/" --pwa-strategy=none

      # هر دیپلوی یک شماره‌ی تازه می‌گیرد تا مرورگر نسخه‌ی قدیمی را نگه ندارد
      - name: Cache-bust
        run: |
          V=$(date +%s)
          cd build/web
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=$V#g" index.html || true
          sed -i "s#\"main.dart.js\"#\"main.dart.js?v=$V\"#g" flutter_bootstrap.js || true
          grep -o "main.dart.js[^\"]*" flutter_bootstrap.js | head -1 || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
