name: Unzip and clean

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/unzip-and-clean.yml'
      - '.github/scripts/place_zip.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-and-clean
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # اگه سکرت PAT نذاری، با توکن پیش‌فرض اجرا میشه
          token: ${{ secrets.PAT || github.token }}

      - name: Unzip, delete zips, commit and push
        id: run
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s globstar nullglob

          for attempt in 1 2 3 4; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"

            zips=( **/*.zip )
            if [ ${#zips[@]} -eq 0 ]; then
              echo "No zip files found."
              exit 0
            fi

            for z in "${zips[@]}"; do
              echo "==> $z"
              # ساختار داخل zip هرچی باشه، فایل‌ها سرِ جای درست (lib/ و …) قرار می‌گیرن
              # و پوشه‌های اضافیِ کنار lib (map/ screens/ … ) پاک میشن
              # توکن پیش‌فرض اجازه‌ی تغییر workflow ندارد؛ پس پوشه‌ی .github داخل zip نادیده گرفته میشه
              if [ -z "${{ secrets.PAT }}" ]; then allow_wf=no; else allow_wf=yes; fi
              bash .github/scripts/place_zip.sh "$z" "$PWD" "$allow_wf"
              git rm -q -f "$z"
            done

            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi
            git commit -q -m "chore: unzip archives and remove zip files"

            if git push origin "HEAD:$BR"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to push after retries."
          exit 1

      # پوش با توکن پیش‌فرض، workflowهای دیگر را خودکار اجرا نمی‌کند؛ پس بیلدها را دستی صدا می‌زنیم
      - name: Trigger web deploy (GitHub Pages)
        if: steps.run.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref "${{ github.ref_name }}" || echo "deploy-web.yml not found, skipped"

      - name: Trigger build (APK / Windows)
        if: steps.run.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}" || echo "build.yml not found, skipped"
