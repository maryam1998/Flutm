name: Unzip and clean

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/unzip-and-clean.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-and-clean
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # اگه سکرت PAT نذاری، با توکن پیش‌فرض اجرا میشه
          token: ${{ secrets.PAT || github.token }}

      - name: Unzip, delete zips, commit and push
        id: run
        env:
          BR: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s globstar nullglob

          for attempt in 1 2 3 4; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"

            zips=( **/*.zip )
            if [ ${#zips[@]} -eq 0 ]; then
              echo "No zip files found."
              exit 0
            fi

            for z in "${zips[@]}"; do
              echo "==> $z"
              tmp=$(mktemp -d)
              unzip -q -o "$z" -d "$tmp"

              # توکن پیش‌فرض اجازه‌ی ساخت/تغییر workflow ندارد؛ پس پوشه‌ی .github داخل zip نادیده گرفته میشه
              # (با PAT این خط اثری نداره چون اجازه داره، ولی بی‌ضرره)
              if [ -z "${{ secrets.PAT }}" ]; then
                find "$tmp" -type d -name .github -prune -exec rm -rf {} +
              fi

              # اگه همه‌چیز داخل یک پوشه‌ی اصلی بود (مثل maghz_flutter/)، اون پوشه برداشته میشه
              entries=( "$tmp"/* )
              if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
                src="${entries[0]}"
              else
                src="$tmp"
              fi

              # فایل‌ها و پوشه‌ها کنار خود zip ساخته میشن (با همون ساختار)
              cp -a "$src"/. "$(dirname "$z")"/
              rm -rf "$tmp"
              git rm -q -f "$z"
            done

            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi
            git commit -q -m "chore: unzip archives and remove zip files"

            if git push origin "HEAD:$BR"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to push after retries."
          exit 1

      # پوش با توکن پیش‌فرض، workflowهای دیگر را خودکار اجرا نمی‌کند؛ پس بیلد را دستی صدا می‌زنیم
      - name: Trigger build
        if: steps.run.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}" || echo "build.yml not found, skipped"
