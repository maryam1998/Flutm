name: Cleanup stray root files (run once)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # پوشه‌های map/screens/services/state و main.dart کنار lib/ اضافه‌اند و در بیلد استفاده نمی‌شوند
      - name: Remove stray files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch map screens services state main.dart
          if git diff --cached --quiet; then echo "Nothing to remove"; exit 0; fi
          git commit -q -m "chore: remove stray root copies (real code lives in lib/)"
          git push

      - name: Trigger web deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref "${{ github.ref_name }}" || true
