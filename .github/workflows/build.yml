name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.zip'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true                # ← cache خودکار Flutter SDK + pub

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.maghz --project-name maghz /tmp/scaffold
            cp -r /tmp/scaffold/android .
          fi
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?( =)? *flutter\.compileSdkVersion/compileSdk = 36/' "$f"
            fi
          done

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
        # ↑ خروجی جدا برای هر CPU، حجم کمتر، نصب سریع‌تر

      - uses: actions/upload-artifact@v4
        with:
          name: maghz-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true                # ← cache خودکار

      - name: Cache Windows build
        uses: actions/cache@v4
        with:
          path: |
            build/windows
            windows/flutter/ephemeral
          key: windows-build-${{ hashFiles('pubspec.lock', 'windows/**') }}
          restore-keys: windows-build-

      - name: Generate platform folders if missing
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org app.maghz --project-name maghz ../scaffold
            cp -r ../scaffold/windows .
          fi

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: maghz-windows
          path: build/windows/x64/runner/Release
          retention-days: 30
