name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android folder if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=mana --no-pub .
          fi

      - name: Add RECORD_AUDIO permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$MANIFEST"
          fi

      - name: Commit android folder if new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/ pubspec.yaml pubspec.lock 2>/dev/null || git add android/
          git add .github/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Add android platform + permissions"
          git push || true

      - name: Flutter pub get
        run: flutter pub get

      # امضای نسخه‌ی نهایی: ۴ تا Secret در GitHub (Settings ← Secrets and variables ← Actions)
      #   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
      # اگه Secret نباشه، بیلد با کلید debug انجام می‌شه (فقط برای تست؛ برای فروشگاه نه).
      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KS_PASS"
              echo "keyPassword=$KEY_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Release signing: ON"
          else
            echo "::warning::Secrets امضا تنظیم نشده؛ APK با کلید debug ساخته می‌شود (برای فروشگاه معتبر نیست)."
          fi

      # شماره‌ی نسخه (versionCode) با هر اجرا خودکار بالا می‌رود (فروشگاه‌ها لازم دارند)
      # APK یکپارچه → بازار و مایکت  |  AAB → گوگل‌پلی
      - name: Build APK (Bazaar / Myket)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build AAB (Google Play)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mana-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mana-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
